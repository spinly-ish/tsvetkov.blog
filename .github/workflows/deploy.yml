name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Триггер из Directus webhook на publish/update поста.
  # Webhook payload type: { "event_type": "directus_publish" }
  repository_dispatch:
    types: [directus_publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
      DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_BUILD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: pip install --quiet markdown

      - name: Build site
        run: |
          if [ -n "$DIRECTUS_TOKEN" ] && [ -n "$DIRECTUS_URL" ]; then
            echo "::notice::Building from Directus ($DIRECTUS_URL)"
            python3 scripts/build.py --source=directus
          else
            echo "::warning::Directus secrets not set — building from data/snapshot.json (last successful Directus fetch). Set DIRECTUS_URL/DIRECTUS_BUILD_TOKEN to fetch live."
            python3 scripts/build.py --source=snapshot
          fi

      - name: Strip non-public files before upload
        run: |
          # Внутренние артефакты, не должны быть на сайте
          rm -f data/snapshot.json
          rm -rf infra

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
